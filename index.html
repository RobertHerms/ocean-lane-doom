<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Lane: Imps in the House</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; left: 0; top: 0; display: block; width: 100vw; outline: none; cursor: crosshair; }
  body.retro #view { image-rendering: pixelated; }
  body.playing #view { cursor: none; }   /* the mouse turns you; the HUD draws the crosshair */
  #screens { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #mapLayer { position: fixed; inset: 0; pointer-events: none; }   /* automap: over the view, under the HUD's message line */
  #warn { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); padding: 6px 12px; background: rgba(60, 0, 0, 0.8);
    color: #ffd28a; font-size: 13px; border-radius: 6px; z-index: 20; }
  .hidden { display: none !important; }
  /* touch: left stick walks, right stick looks; fire / use / weapon buttons on the right */
  #view, .stick, .tbtn { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .stick { position: fixed; width: 132px; height: 132px; border-radius: 50%; background: rgba(40, 10, 5, .35);
    border: 2px solid rgba(255, 190, 150, .35); display: none; z-index: 6; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255, 210, 180, .75); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); transition: transform .12s ease-out; }
  .stick.active .knob { transition: none; }
  .tbtn { position: fixed; display: none; z-index: 6; width: 64px; height: 64px; padding: 0; border: 2px solid rgba(255, 190, 150, .45);
    border-radius: 50%; background: rgba(60, 12, 6, .5); color: #ffd9c0; font: 700 12px/1 system-ui, sans-serif; letter-spacing: .04em; }
  .tbtn.small { width: 46px; height: 46px; font-size: 11px; }
  .tbtn.on { background: rgba(200, 40, 20, .65); }
  body.touch.playing .stick, body.touch.playing .tbtn { display: block; }
</style>
<script type="importmap">
  { "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/examples/jsm/": "./vendor/three/examples/jsm/",
      "three/addons/": "./vendor/three/examples/jsm/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
  } }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="mapLayer"></div>
<canvas id="stbar"></canvas>
<canvas id="msg"></canvas>
<div id="crosshair"></div>
<div id="flash"></div>
<div id="stickWalk" class="stick" aria-label="Move"><div class="knob"></div></div>
<div id="stickLook" class="stick" aria-label="Look"><div class="knob"></div></div>
<button id="btnFire" class="tbtn" aria-label="Fire">FIRE</button>
<button id="btnUse" class="tbtn" aria-label="Use">USE</button>
<button id="btnNext" class="tbtn small" aria-label="Next weapon">GUN</button>
<button id="btnMap" class="tbtn small" aria-label="Map">MAP</button>
<button id="btnMenu" class="tbtn small" aria-label="Menu">| |</button>
<div id="screens"></div>
<div id="warn" class="hidden">Lighting hasn't been baked for this layout yet.</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
